services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: clinicflow
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicflow -d clinicflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
