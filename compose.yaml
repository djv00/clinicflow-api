services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: clinicflow
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicflow -d clinicflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: [app]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/clinicflow
      DB_USERNAME: clinicflow
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting PostgreSQL}
      SPRING_SECURITY_USER_NAME: ${SPRING_SECURITY_USER_NAME:-operator}
      SPRING_SECURITY_USER_PASSWORD: ${SPRING_SECURITY_USER_PASSWORD:-}
      CLINICFLOW_VIEWER_USERNAME: ${CLINICFLOW_VIEWER_USERNAME:-viewer}
      CLINICFLOW_VIEWER_PASSWORD: ${CLINICFLOW_VIEWER_PASSWORD:-}
      CLINICFLOW_ADMIN_USERNAME: ${CLINICFLOW_ADMIN_USERNAME:-admin}
      CLINICFLOW_ADMIN_PASSWORD: ${CLINICFLOW_ADMIN_PASSWORD:-}
      CLINICFLOW_DEMO_DATA_ENABLED: ${CLINICFLOW_DEMO_DATA_ENABLED:-false}
      CLINICFLOW_TIME_ZONE: ${CLINICFLOW_TIME_ZONE:-UTC}
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 20s
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "4", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

volumes:
  postgres-data:
